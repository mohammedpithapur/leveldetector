[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; Pulled in by Adafruit IO but not for the ESP8266; their WiFiUdp.h shadows the core one
lib_ignore =
    WiFi101
    WiFiNINA_-_Adafruit_Fork
lib_deps =
    tzapu/WiFiManager
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/DHT sensor library
    adafruit/Adafruit IO Arduino
